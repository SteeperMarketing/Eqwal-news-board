name: Refresh Eqwal News Feed

on:
  schedule:
    # Runs every hour at :00 (UTC). Adjust cron if you want different timing.
    # Format: minute hour day month weekday
    - cron: '0 * * * *'

  # Also allow a manual run from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No extra packages needed — scraper uses only the Python standard library

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated feed.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.json
          # Only commit if feed.json actually changed
          git diff --cached --quiet || git commit -m "chore: refresh Eqwal news feed [skip ci]"
          git push
